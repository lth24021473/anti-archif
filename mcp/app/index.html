<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archify Studio</title>
  <!-- ARCHIFY_STUDIO_CSS -->
</head>
<body>
  <div id="studio-root" class="studio-shell">
    <header class="studio-bar">
      <div class="studio-brand">
        <span class="studio-logo" aria-hidden="true">
          <svg viewBox="0 0 400 360" width="18" height="16" fill="none">
            <path d="M151 94 81 164C67 178 60 191 60 212V248H97V212C97 204 100 199 106 193L179 120Z" fill="#0856F5"/>
            <path d="M238 135C252 132 261 126 270 116L321 167C334 180 339 194 339 213V248H303V213C303 204 300 199 294 193Z" fill="#1DBBB7"/>
            <rect x="146" y="16" width="110" height="104" rx="30" fill="#0856F5"/>
            <rect x="18" y="238" width="110" height="104" rx="28" fill="#0856F5"/>
            <rect x="274" y="238" width="108" height="104" rx="28" fill="#1DBBB7"/>
          </svg>
        </span>
        <div class="studio-title-wrap">
          <strong id="studio-title">Archify Studio</strong>
          <span id="studio-subtitle" class="studio-subtitle"></span>
        </div>
        <span id="studio-badge" class="studio-badge" hidden></span>
      </div>
      <div class="studio-actions" role="toolbar" aria-label="Studio controls">
        <button id="btn-library" class="studio-btn" type="button" title="Browse artifacts">Library</button>
        <input id="search-input" class="studio-search" type="search" placeholder="Find node / item…" hidden />
        <select id="preset-select" class="studio-select" title="Visual preset" hidden>
          <option value="classic">Classic</option>
          <option value="signal-flow">Signal Flow</option>
          <option value="blueprint">Blueprint</option>
          <option value="editorial">Editorial</option>
        </select>
        <button id="btn-theme" class="studio-btn" type="button" title="Toggle SVG theme">Theme</button>
        <button id="btn-zoom-out" class="studio-btn" type="button" hidden>−</button>
        <button id="btn-zoom-fit" class="studio-btn" type="button" hidden>Fit</button>
        <button id="btn-zoom-in" class="studio-btn" type="button" hidden>+</button>
        <button id="btn-export-svg" class="studio-btn" type="button" hidden>Export SVG</button>
        <button id="btn-visual-check" class="studio-btn" type="button" hidden>Visual Check</button>
      </div>
    </header>

    <div id="status-banner" class="studio-banner" hidden role="status"></div>

    <div class="studio-workspace">
      <aside id="library-drawer" class="studio-drawer" hidden aria-label="Artifact Library">
        <div class="drawer-head">
          <strong>Artifacts</strong>
          <button id="btn-refresh-library" class="studio-btn studio-btn-sm" type="button">Refresh</button>
        </div>
        <div id="library-list" class="library-list"></div>
      </aside>

      <main id="studio-main" class="studio-main">
        <div id="empty-state" class="empty-state">
          <p class="empty-title">Archify Studio ready</p>
          <p class="empty-copy">Generate or open any Archify diagram, explainer, story, architecture delta, PR visual pack, or Code Analysis report to inspect it here.</p>
          <button id="btn-open-library-empty" class="studio-btn studio-btn-primary" type="button">Load Recent Artifacts</button>
        </div>
        <div id="mode-view" class="mode-view" hidden></div>
      </main>

      <aside id="passport-drawer" class="passport-drawer" hidden aria-label="Inspector">
        <div class="drawer-head">
          <div>
            <span class="passport-eyebrow" id="passport-eyebrow">INSPECTOR</span>
            <h2 id="passport-title" class="passport-title"></h2>
          </div>
          <button id="btn-close-passport" class="studio-btn studio-btn-sm" type="button" aria-label="Close inspector">×</button>
        </div>
        <div id="passport-body" class="passport-body"></div>
      </aside>
    </div>
  </div>
  <!-- ARCHIFY_STUDIO_JS -->
</body>
</html>
